# 取个件呗 Web 版 —— Docker Compose 部署配置
# 数据库：使用 1Panel 已安装的 MySQL（宿主 127.0.0.1:3306），不再内置容器
# 使用：docker compose up -d --build
services:
  pickup-web:
    build: .
    image: pickup-web:latest
    container_name: pickup-web
    restart: unless-stopped
    # host 网络：容器与宿主机共享网络栈，直连 1Panel MySQL(127.0.0.1:3306)
    network_mode: host
    environment:
      # 端口可在 .env 覆盖（如服务器想用 18018：.env 写 PORT=18018），默认 3000
      - PORT=${PORT:-3000}
      # ---------- MySQL（1Panel 创建的 KD 库）----------
      - USE_MYSQL=1
      - DB_HOST=127.0.0.1
      - DB_PORT=3306
      - DB_NAME=kd
      - DB_USER=kd
      - DB_PASSWORD=kdkdkd
      # 图片上传目录（挂宿主机卷持久化）
      - UPLOAD_DIR=/data/uploads
      # 【必改】管理员初始密码（首次启动创建 admin 账号用）
      - ADMIN_PASSWORD=Wyc50818
      # 【必改】JWT 密钥，换成一串随机字符
      - JWT_SECRET=KingKing
      # ---------- Kook 机器人（可选；也可在管理后台「Kook 对接」页配置，后台保存优先）----------
      # 服务器玩法：在同目录建 .env 写入以下三项，compose 自动读取
      - KOOK_BOT_TOKEN=${KOOK_BOT_TOKEN:-}
      - KOOK_HALL_CHANNEL_ID=${KOOK_HALL_CHANNEL_ID:-}
      - KOOK_ADMIN_CHANNEL_ID=${KOOK_ADMIN_CHANNEL_ID:-}
      - KOOK_ORDER_CHANNEL_ID=${KOOK_ORDER_CHANNEL_ID:-}
      # 时区：按中国时间切"每日结算"
      - TZ=Asia/Shanghai
    volumes:
      # 上传文件持久化到宿主机 ./data/uploads
      - ./data:/data
